# Docker Compose para OpenHands v0.28
# Docs: https://github.com/All-Hands-AI/OpenHands
#
# Pré-requisitos:
#   - Docker Desktop rodando
#   - Arquivo .env preenchido (copie .env.example → .env)
#
# Uso:
#   cd vendor/openhands
#   copy .env.example .env    (Windows) | cp .env.example .env (Linux/Mac)
#   # edite .env com sua LLM API key
#   docker compose up -d
#
# Interface web: http://localhost:3000
# API REST:      http://localhost:3000/api
# Swagger:       http://localhost:3000/openapi.json

services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.28
    container_name: openhands
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ghcr.io/all-hands-ai/runtime:0.28-nikolaik
      LOG_ALL_EVENTS: "true"
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-groq/llama-3.3-70b-versatile}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      SANDBOX_LOCAL_RUNTIME_URL: ${SANDBOX_LOCAL_RUNTIME_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands-state:/root/.openhands
      - ${WORKSPACE_DIR:-../../data/openhands-workspace}:/opt/workspace_base
    networks:
      - openhands-net

  # Ollama — container Docker (opcional)
  # ATENÇÃO: se o Ollama já estiver instalado nativamente no host, não suba este container.
  # Nesse caso, use OPENHANDS_LLM_BASE_URL=http://host.docker.internal:11434 no .env
  # Para usar este container: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - openhands-net
    # Descomente para usar GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  openhands-net:
    driver: bridge

volumes:
  openhands-state:
  ollama-data:
